# Acervo: marfim, floresta e tipografia editorial, com fontes locais.
[theme]
base = "light"
primaryColor = "#176B4A"
backgroundColor = "#F5F3ED"
secondaryBackgroundColor = "#ECEFE8"
textColor = "#202B26"
borderColor = "#D9DED5"
baseRadius = "9px"
font = "sans-serif"
headingFont = "serif"

[theme.sidebar]
backgroundColor = "#FFFEFA"
secondaryBackgroundColor = "#ECEFE8"

[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[runner]
# Finish state updates before handling the next move or lesson transition.
fastReruns = false
