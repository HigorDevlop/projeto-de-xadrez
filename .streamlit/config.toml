# Coach Chess: tema escuro unificado e fontes locais.
[theme]
base = "dark"
primaryColor = "#0c92ae"
backgroundColor = "#020d20"
secondaryBackgroundColor = "#062038"
textColor = "#d9f5ff"
borderColor = "#17617b"
baseRadius = "4px"
font = "sans-serif"
headingFont = "sans-serif"

[theme.sidebar]
backgroundColor = "#04172c"
secondaryBackgroundColor = "#062038"

[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[runner]
# Finish state updates before handling the next move or lesson transition.
fastReruns = false
