# Coach Chess: tema escuro unificado e fontes locais.
[theme]
base = "dark"
primaryColor = "#ff8000"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#232323"
textColor = "#f5f5f5"
borderColor = "#343434"
baseRadius = "9px"
font = "sans-serif"
headingFont = "sans-serif"

[theme.sidebar]
backgroundColor = "#121212"
secondaryBackgroundColor = "#232323"

[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[runner]
# Finish state updates before handling the next move or lesson transition.
fastReruns = false
