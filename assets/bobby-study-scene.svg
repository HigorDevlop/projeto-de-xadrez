<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Animação ilustrada: Bobby Fischer entra no salão, puxa a cadeira e se senta para estudar">
<defs>
  <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#17262b"/><stop offset="1" stop-color="#36534c"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#84603f"/><stop offset="1" stop-color="#322820"/></linearGradient>
  <linearGradient id="wood"><stop stop-color="#543723"/><stop offset=".45" stop-color="#ba8655"/><stop offset="1" stop-color="#63422b"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#ffe6ae" stop-opacity=".32"/><stop offset="1" stop-color="#ffe6ae" stop-opacity="0"/></radialGradient>
  <pattern id="squares" width="52" height="52" patternUnits="userSpaceOnUse"><rect width="52" height="52" fill="#e6dfc3"/><path d="M0 0h26v26H0zM26 26h26v26H26z" fill="#486949"/></pattern>
  <g id="pawn"><ellipse cy="1" rx="8" ry="3"/><path d="M-7 0-3-12h6L7 0Z"/><circle cy="-16" r="5"/></g>
  <g id="rook"><ellipse cy="1" rx="9" ry="3"/><path d="M-8 0-5-19H5L8 0ZM-7-19v-8h4v4h3v-4h3v4h3v-4h3v8Z"/></g>
  <g id="king"><ellipse cy="1" rx="10" ry="3"/><path d="M-8 0-5-23H5L8 0ZM-6-23-8-31H8L6-23ZM-2-33v-10h4v10ZM-7-40H7v3H-7Z"/></g>
</defs>
<style>
 .actor {animation:arrive 7.6s both;transform:translate(440px,150px)}
 .upper {animation:sit 7.6s both}
 .leg-left {transform-origin:0px 121px;animation:left-step 7.6s both}
 .leg-right {transform-origin:15px 121px;animation:right-step 7.6s both}
 .arm {transform-origin:25px 62px;animation:reach 7.6s both}
 .chair {animation:chair-pull 7.6s both}
 .head {transform-origin:0px 40px;animation:look 7.6s both}
 .curtain {animation:reveal .6s ease-out both}
 @keyframes arrive {0%{transform:translate(100px,150px)} 12%{transform:translate(135px,148px)} 20%{transform:translate(210px,152px)} 28%{transform:translate(290px,148px)} 36%{transform:translate(375px,152px)} 43%,100%{transform:translate(440px,150px)}}
 @keyframes sit {0%,57%{transform:translateY(0)} 70%,100%{transform:translateY(39px)}}
 @keyframes left-step {0%,16%,28%,40%{transform:rotate(17deg)} 10%,22%,34%{transform:rotate(-17deg)} 45%,57%{transform:rotate(0)} 70%,100%{transform:translateY(39px) rotate(-62deg)}}
 @keyframes right-step {0%,16%,28%,40%{transform:rotate(-17deg)} 10%,22%,34%{transform:rotate(17deg)} 45%,57%{transform:rotate(0)} 70%,100%{transform:translateY(39px) rotate(-49deg)}}
 @keyframes reach {0%,40%{transform:rotate(8deg)} 48%,57%{transform:rotate(48deg)} 66%{transform:rotate(0)} 76%,100%{transform:rotate(-58deg)}}
 @keyframes chair-pull {0%,43%{transform:translateX(0)} 55%,66%{transform:translateX(-40px)} 76%,100%{transform:translateX(-20px)}}
 @keyframes look {0%,68%{transform:rotate(0)} 80%,100%{transform:rotate(9deg)}}
 @keyframes reveal {from{opacity:0}to{opacity:1}}
</style>
